[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Single Page Application (SPA) 새로고침 시 404 방지 라우팅 리다이렉트
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 전자칠판, iframe 및 학교 스마트 기기 호환을 위한 보안 헤더 설정
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"
